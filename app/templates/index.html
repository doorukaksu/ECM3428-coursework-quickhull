<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire Containment</title>
    <link rel="stylesheet" href=" {{ url_for('static', filename='css/style.css')}}">
</head>
<body>
  <h1>Boundary Mapper</h1>
  <p>Click the canvas to add points.</p>

  <canvas id="canvas" width="600" height="600"></canvas>

  <div class="controls">
    <input id="count" type="number" value="100" min="3" max="5000">
    <button id="generate">Generate random</button>
    <button id="clear">Clear</button>
  </div>

  <div class="stats">
    <span>Points: <b id="points">0</b></span>
    <span>Hull vertices: <b id="vertices">0</b></span>
    <span>Area: <b id="area">0</b></span>
    <span>Perimeter: <b id="perimeter">0</b></span>
  </div>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
  
</body>
</html>
